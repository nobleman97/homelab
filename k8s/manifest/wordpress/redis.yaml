apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            # Cache-only usage; observed footprint is small.
            requests:
              cpu: 25m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wordpress
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379