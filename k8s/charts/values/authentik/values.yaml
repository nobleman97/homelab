---

## Globally shared configuration for authentik components.
global:
  # -- Secrets with credentials to pull images from a private registry
  imagePullSecrets: []
  deploymentAnnotations: {}
  podAnnotations: {}

  secretAnnotations: {}
  podLabels: {}
  addPrometheusAnnotations: false
  securityContext: {}
  hostAliases: []
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []

authentik:
  # -- whether to create the authentik configuration secret
  enabled: false

  existingSecret:
    secretName: authentik

server:
  # -- whether to enable server resources
  enabled: true

  ingress:
    # -- enable an ingress resource for the authentik server
    enabled: false

  # -- One gunicorn worker instead of the default two. Each worker loads the
  # full Django app (~300Mi RSS); one is plenty for a single-user homelab.
  env:
    - name: AUTHENTIK_WEB__WORKERS
      value: "1"

  # -- Resource requests for the authentik server. With 2 gunicorn workers the
  # cadvisor-only metrics (2026-11-07..22) showed p95 986Mi, peak 1024Mi, CPU
  # p95 53m. 768Mi assumes ~300Mi saved by WEB__WORKERS=1 — re-check after a
  # few days. Requests only, no limits.
  resources:
    requests:
      cpu: 75m
      memory: 768Mi

worker:
  # -- Resource requests for the authentik worker. Memory is flat, not bursty:
  # cadvisor-only metrics (2026-11-07..22) show p50 587Mi, p95 611Mi, peak
  # 629Mi; CPU p95 49m with rare spikes to ~380m. (Earlier "2Gi bursts" came
  # from dashboards double-counting kubelet /metrics/resource + /metrics/cadvisor.)
  # Requests only, no limits.
  resources:
    requests:
      cpu: 50m
      memory: 640Mi

# helm upgrade  --install authentik goauthentik/authentik --version 2026.2.3 -f values.yaml -n apps  
