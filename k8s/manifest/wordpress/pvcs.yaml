apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: wordpress
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
  storageClassName: longhorn-retain
  volumeName: smaller-mariadb-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  namespace: wordpress
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 6Gi
  storageClassName: longhorn-static
  volumeName: smaller-wordpress-pv

