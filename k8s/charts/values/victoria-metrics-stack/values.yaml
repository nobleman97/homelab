# Soft affinity: prefer the dedicated monitoring node (label: use=monitoring)
# Using preferred rather than required so pods can still schedule if node is unavailable
_affinity: &monitoring_affinity
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: use
              operator: In
              values:
                - monitoring

# Resource requests below are sized from 15 days of this cluster's own
# VictoriaMetrics history: p95 usage plus modest headroom. Requests only, by
# design — memory limits risk OOMKills and CPU limits cause throttling.
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "15d"
    # Observed p95 949Mi / peak 968Mi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
    storage:
      storageClassName: longhorn-retain
      resources:
        requests:
          storage: 20Gi
    affinity: *monitoring_affinity

vmagent:
  enabled: true
  spec:
    # Observed p95 133Mi / peak 149Mi
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
    affinity: *monitoring_affinity

vmalert:
  enabled: true
  spec:
    # Observed peak ~81Mi
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
    affinity: *monitoring_affinity

alertmanager:
  enabled: true
  spec:
    # Full alertmanager config (including SMTP password) lives in this secret.
    # Create it manually before syncing — see docs/monitoring-stack-plan.md.
    configSecret: alertmanager-config
    # Idles well under 96Mi; matched to vmalert for simplicity.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
    affinity: *monitoring_affinity

# k3s runs the apiserver, etcd, scheduler and kubelet in one process with one
# metrics registry, so the server node's kubelet /metrics re-exposes everything
# the kubeApiServer job already scrapes (~59k duplicate series, ~30% of the
# total). Drop the apiserver_/etcd_ families from the kubelet job.
# These rules replace the chart's kubelet defaults (lists don't merge), so the
# first three entries copy chart 0.79.1's defaults.
kubelet:
  vmScrapes:
    kubelet:
      spec:
        metricRelabelConfigs:
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            source_labels: [__name__]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
          - action: drop
            source_labels: [__name__]
            regex: (apiserver|etcd)_.+

grafana:
  enabled: true

  deploymentStrategy:
    type: Recreate

  # Observed p95 405Mi / peak 432Mi
  resources:
    requests:
      cpu: 50m
      memory: 448Mi

  # This chart exposes a SINGLE shared resources block for every Grafana sidecar
  # container — there is no sidecar.dashboards.resources / sidecar.datasources.resources.
  # sc-dashboard sits at ~104Mi and sc-datasources at ~93Mi, so 128Mi covers both.
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi

  persistence:
    enabled: true
    storageClassName: longhorn-retain
    size: 2Gi

  affinity: *monitoring_affinity

  ingress:
    enabled: false

  # GF_AUTH_GENERIC_OAUTH_CLIENT_ID and GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
  # are injected from this secret and auto-applied by Grafana's GF_* env var mapping.
  envFromSecret: grafana-oidc-secret

  # VictoriaLogs datasource — logs are queried only through Grafana (see
  # docs/log-collection-plan.md). isDefault MUST stay false: a second default
  # datasource crashes Grafana on startup.
  plugins:
    - victoriametrics-logs-datasource
  additionalDataSources:
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
      isDefault: false

  grafana.ini:
    server:
      domain: grafana.osose.xyz
      root_url: https://grafana.osose.xyz
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      scopes: openid profile email groups
      auth_url: https://auth.osose.xyz/application/o/authorize/
      token_url: https://auth.osose.xyz/application/o/token/
      api_url: https://auth.osose.xyz/application/o/userinfo/
      signout_redirect_url: https://auth.osose.xyz/application/o/grafana/end-session/
      role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
      use_pkce: true

