apiVersion: v1
kind: Pod
metadata:
  name: debug-pv
  namespace: monitoring
spec:
  containers:
    - name: debug
      image: busybox
      command: ["/bin/sh", "-c", "sleep 3600"]
      ports:
        - containerPort: 80
      volumeMounts:
        - name: metrics-volume          # Must match the volume name below
          mountPath: /victoria-metrics-data/ # Path inside the container where files will live
  volumes:
    - name: metrics-volume            # An arbitrary identifier for this pod volume
      persistentVolumeClaim:
        claimName: vmsingle-monitoring-victoria-metrics-k8s-stack # REPLACE with your actual bound PVC name
