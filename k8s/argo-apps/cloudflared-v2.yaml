apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared-v2
  namespace: argocd
spec:
  destination:
    namespace: cloudflare
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/nobleman97/homelab.git
    targetRevision: HEAD
    path: k8s/manifest/cloudflared-v2
  project: default
  syncPolicy:
    automated: {}
