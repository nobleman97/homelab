apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: master-db
  namespace: database
spec:
  instances: 1          # 1 primary + 2 replicas; use 1 for dev
  # primaryUpdateStrategy: unsupervised

  # Prefer to keep the instance off k3s-worker-2. Its Proxmox host `david` wedges
  # its NIC and loses all guest networking until power-cycled — see
  # docs/worker-2-nic-failure.md. With instances: 1 there is no failover, and
  # Longhorn's node-down-pod-deletion-policy is do-nothing, so a pod on a dead
  # node stays Terminating and holds the volume until the node returns.
  #
  # Preferred, not required: k3s-server is cordoned and tainted `reserved`, so a
  # hard pin would leave k3s-worker-1 as the only eligible node. This way the
  # database falls back to worker-2 rather than staying pending.
  #
  # Note `IgnoredDuringExecution`: this does not evict a pod already running on
  # worker-2. Deleting the instance pod is what actually moves it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k3s-worker-2

  bootstrap:
    recovery:
      source: master-db-backup # use backup from object store to initialize cluster

  externalClusters:
    - name: master-db-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: master-db-store  # restore from this backup

  storage:
    size: 20Gi
    storageClass: longhorn-retain

  # Applies to the `postgres` container only; the barman-cloud sidecar is
  # configured separately on the ObjectStore below.
  # Requests sized from 15d of this cluster's own metrics (p95 569Mi, peak 604Mi).
  # No limits by design: a memory limit here means OOMKill, not backpressure.
  resources:
    requests:
      cpu: 200m
      memory: 640Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: master-db-store-v2  # archive to new path post-recovery

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: master-db-store        # restore source — existing WALs and base backups
  namespace: database
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: "s3://objectstore-199174511003-us-east-1-an"
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-creds
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: master-db-store-v2     # archive destination after recovery — empty path
  namespace: database
spec:
  retentionPolicy: "14d"
  # The `plugin-barman-cloud` sidecar in the instance pod is injected by the
  # plugin, so its resources can only be set here — not from Cluster.spec.resources.
  # The plugin reads them from the ObjectStore named by the *archiver* plugin
  # parameter (this one), not from the recovery ObjectStore above.
  # Requests sized from 15d of metrics (p95 366Mi, peak 590Mi during WAL bursts).
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
  configuration:
    destinationPath: "s3://objectstore-199174511003-us-east-1-an/v2"
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-creds
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: master-db-daily
  namespace: database
spec:
  schedule: "0 50 1 * * *"
  backupOwnerReference: self
  cluster:
    name: master-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

