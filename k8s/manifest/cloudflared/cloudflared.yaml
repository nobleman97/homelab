# Rendered from community-charts/cloudflared 2.2.7 (chart hardcodes ConfigMap name; kept as plain manifests).
# Tunnel homelab-2. Creds secret cloudflared-credentials is created with kubectl, never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/version: "2026.2.0"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |

    tunnel: homelab-2
    credentials-file: /etc/cloudflared/creds/cfd_credentials.json
    originRequest:
      connectTimeout: 30s

    ingress: 
      - hostname: argo.osose.xyz
        service: http://argo-argocd-server.argocd.svc.cluster.local:80
      - hostname: auth.osose.xyz
        service: http://authentik-server.apps.svc.cluster.local:80
      - hostname: longhorn.osose.xyz
        service: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
      - hostname: grafana.osose.xyz
        service: http://monitoring-grafana.monitoring.svc.cluster.local:80
      - hostname: techguide.osose.xyz
        service: http://tech-noexp-svc.landing-pages.svc.cluster.local:80
      - hostname: jellyfin.osose.xyz
        service: http://jellyfin.jellyfin.svc.cluster.local:8096
      - hostname: sonar.osose.xyz
        service: http://sonarr.jellyfin.svc.cluster.local:8989
      - service: http_status:404

    metrics: 0.0.0.0:2000
    metrics-update-freq: 5s

    autoupdate-freq: 24h
    no-autoupdate: true

    grace-period: 30s

    retries: 5

    # auto, http2, h2mux, quic
    protocol: auto

    # info, warn, error, fatal, panic
    loglevel: info
    transport-loglevel: warn
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudflared
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/version: "2026.2.0"
spec:
  selector:
    matchLabels:
      app: cloudflared
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: cloudflared
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: cloudflared
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared
    spec:
      serviceAccountName: cloudflared
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
        - name: net.ipv4.ping_group_range
          value: 0 2147483647
      terminationGracePeriodSeconds: 30
      containers:
        - name: cloudflared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: []
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          image: "cloudflare/cloudflared:2026.2.0"
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          imagePullPolicy: IfNotPresent
          ports:
            - name: active-con-stat
              containerPort: 2000
              protocol: TCP
          env:
            - name: TUNNEL_ORIGIN_CERT
              value: "/etc/cloudflared/creds/cfd_cert.pem"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          resources:
            {}
      volumes:
        - name: creds
          projected:
            sources:
              - secret:
                  name: cert-pem-file-secret
              - secret:
                  name: cloudflared-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          operator: Exists
