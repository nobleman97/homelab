---
# Jellyfin config, database, users, metadata. Small but important, keep it on Longhorn.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 5Gi
---
# Media library. Swap this for an NFS PV/PVC if your media lives on a NAS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 20Gi #200Gi
---
