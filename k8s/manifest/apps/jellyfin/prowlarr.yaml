apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # Pinned to k3s-worker-3: rebalancing off worker-1/2, which were near full on memory requests (2026-11-22).
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-3
      securityContext:
        fsGroup: 1000
      containers:
        - name: prowlarr
          # Docker Hub mirror of lscr.io (same digests). ghcr/lscr pulls stalled on worker-3 during the 2026-11-22 move.
          image: docker.io/linuxserver/prowlarr:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Africa/Lagos
          ports:
            - name: webui
              containerPort: 9696
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
