global:
  domain: argo.osose.xyz

configs:
  params:
    server.insecure: true

  cm:
    oidc.config: |
      name: authentik
      issuer: https://auth.osose.xyz/application/o/argocd/
      clientID: oLyMdhljwzKAJP7ySnVO0XvB5VaXYrP4ROEAafNz
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups

  rbac:
    policy.csv: |
      g, argocd-admins, role:admin
    policy.default: role:readonly
    
# Resource requests below are sized from 15 days of this cluster's own
# VictoriaMetrics history. Requests only — no limits are set in this phase.

controller:
  # application-controller (StatefulSet): p95 513Mi, peak 602Mi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

repoServer:
  # p95 and peak both 121Mi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi

# Minor components: nominal requests so the scheduler accounts for them.
dex:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi

notifications:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi

server:
  # p95 and peak both 90Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  ingress:
    enabled: false  # Cloudlare --> Tunnel --> ArgoCD
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    extraTLS:
      - secretName: argocd-tls
        hosts:
          - argo.osose.xyz



# helm install argocd argo/argo-cd --version 9.5.4 -f values.yaml -n argocd
