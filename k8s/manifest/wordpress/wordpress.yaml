apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1

  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      # Prefer the node running mariadb-0: lower DB latency, and the large
      # floating-tag image is already cached there (a cold pull on another node
      # took >8 min of downtime on 2026-11-22). Preferred, not required.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mariadb
      containers:
        - name: wordpress
          image: wordpress:php8.5-apache  #wordpress:7.2-php8.5-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb.wordpress.svc.cluster.local
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_REDIS_HOST', 'redis.wordpress.svc.cluster.local');
                define('WP_REDIS_PORT', 6379);
                define('WP_HOME', 'https://cognitaid.com');
                define('WP_SITEURL', 'https://cognitaid.com');
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                  $_SERVER['HTTPS'] = 'on';
                }
                define('DISALLOW_FILE_MODS', true);
            - name: WORDPRESS_TABLE_PREFIX
              value: "wpz7_"
          resources:
            # Requests sized from 15d of metrics (p95 339Mi, peak 345Mi).
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              # One uncached homepage render costs ~240ms CPU (no page cache on
              # Apache), so a 500m quota (50ms/100ms period) throttled every page
              # view and fired CPUThrottlingHigh. 2 cores lets single requests run
              # unthrottled; still capped (not unlimited) so a compromised pod
              # can't take all 3 node cores. Average use is ~10m.
              cpu: "2"
              # Memory is bounded by MaxRequestWorkers in mpm-prefork-tuning.conf.
              memory: 512Mi
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
            - name: apache-hardening
              mountPath: /etc/apache2/conf-enabled/block-xmlrpc.conf
              subPath: block-xmlrpc.conf
              readOnly: true
            - name: apache-hardening
              mountPath: /etc/apache2/conf-enabled/block-uploads-php.conf
              subPath: block-uploads-php.conf
              readOnly: true
            # subPath mounts don't hot-reload: restart the pod after changing these.
            - name: apache-hardening
              mountPath: /etc/apache2/conf-enabled/block-scanners.conf
              subPath: block-scanners.conf
              readOnly: true
            - name: apache-hardening
              mountPath: /etc/apache2/conf-enabled/mpm-prefork-tuning.conf
              subPath: mpm-prefork-tuning.conf
              readOnly: true
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wordpress-pvc
        - name: apache-hardening
          configMap:
            name: wordpress-apache-hardening
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80

